name: Build EXE

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --uac-admin `
            --name ArgyllPrinterProfiler `
            --hidden-import argyll_profiler.config `
            --hidden-import argyll_profiler.logger `
            --hidden-import argyll_profiler.profiler `
            --hidden-import argyll_profiler.metadata `
            --hidden-import argyll_profiler.papers `
            --hidden-import argyll_profiler.report `
            --hidden-import argyll_profiler.backup `
            --hidden-import argyll_profiler.printers `
            --add-data "theme.json;." `
            --add-data "theme_light.json;." `
            printer_menu.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArgyllPrinterProfiler-Windows
          path: dist/ArgyllPrinterProfiler.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ArgyllPrinterProfiler.exe